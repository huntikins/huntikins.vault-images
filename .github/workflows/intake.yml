name: Photo intake (retired)

# Photos are never uploaded to this public repository. A raw camera photo
# carries GPS coordinates, and anything pushed here (even to a PR branch that
# is later deleted) stays public through refs/pull/N/head and the commit SHA.
#
# The owner uploads to the PRIVATE huntikins.vault repo instead (photo-intake/),
# whose workflow re-encodes and scrubs the photos and pushes only the clean
# files here. This workflow exists only to refuse anything that still arrives
# the old way: it comments, fails, and never checks out, processes or merges.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'intake/**'
      - '**/*.jpg'
      - '**/*.JPG'
      - '**/*.jpeg'
      - '**/*.JPEG'
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.heic'
      - '**/*.HEIC'

permissions:
  pull-requests: write

jobs:
  refuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Refuse and explain
        run: |
          cat > "$RUNNER_TEMP/report.md" <<'MD'
          ### Photo uploads to this repository are closed — nothing was published

          This repository is public. Photos uploaded here are visible to anyone, including the hidden location data inside them, even after this pull request is closed.

          **Do this now:** close this pull request and delete its branch, then upload the photos to the private vault instead: open `huntikins/huntikins.vault`, go into `photo-intake/`, **Add file → Upload files**, and start a pull request with the same `INV-0010: IMG_6513 IMG_6514` lines. The vault cleans the photos and publishes them here.

          Deleting the branch does not remove the commit from GitHub's pull request refs. If these photos had location data, ask GitHub Support to purge this pull request's commits.
          MD
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/report.md"
          exit 1
